<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CleanDevTools Logo">
  <defs>
    <linearGradient id="cdt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="32" height="32" rx="8" fill="url(#cdt-grad)" />
  
  <!-- Modern Code Chevron & Clean Sparkle Mark -->
