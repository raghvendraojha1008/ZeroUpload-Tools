    d="M 11 9 L 17 16 L 11 23"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Right Sparkle Star: Clean / Instant -->
