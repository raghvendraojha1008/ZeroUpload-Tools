<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- route-meta:start -->
    <title>CleanDevTools — Fast, Free &amp; 100% Private Developer Utilities</title>
    <meta
      name="description"
      content="Free, clean developer utilities that run 100% in your browser. Convert JSON to CSV, decode JWT tokens, clean spreadsheets and test regex with zero cloud uploads."
    />
    <link rel="canonical" href="https://cleandevtools.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CleanDevTools" />
    <meta property="og:title" content="CleanDevTools — Fast, Free &amp; 100% Private Developer Utilities" />
    <meta
      property="og:description"
      content="Free, clean developer utilities that run 100% in your browser. Convert JSON to CSV, decode JWT tokens, clean spreadsheets and test regex with zero cloud uploads."
    />
    <meta property="og:url" content="https://cleandevtools.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CleanDevTools — Fast, Free &amp; 100% Private Developer Utilities" />
    <meta
      name="twitter:description"
      content="Free, clean developer utilities that run 100% in your browser. Convert JSON to CSV, decode JWT tokens, clean spreadsheets and test regex with zero cloud uploads."
    />
    <!-- route-meta:end -->
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fonts are served from this origin so a tool page never opens a third-party connection. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('zu-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          /* localStorage unavailable — default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
